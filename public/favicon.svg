<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d0a"/>
      <stop offset="100%" stop-color="#141914"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3ddc84"/>
      <stop offset="50%" stop-color="#a4f479"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded chassis / hardware bezel -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="#273827" stroke-width="2.5"/>
  <rect x="5" y="5" width="54" height="54" rx="11" fill="none" stroke="#121812" stroke-width="1.5"/>

  <!-- Optical Camera Aperture Ring / Sound Wave Reticle -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#223322" stroke-width="1.5" stroke-dasharray="2 3"/>
  <circle cx="32" cy="32" r="14" fill="#080c08" stroke="#334d33" stroke-width="1"/>

  <!-- Sound Sine Wave cutting through Camera Sensor -->
  <path d="M 12 32 Q 22 14, 32 32 T 52 32" fill="none" stroke="url(#wave)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Lens Center Sensor Core -->
  <circle cx="32" cy="32" r="3.5" fill="#a4f479" filter="url(#glow)"/>

  <!-- Top-right hardware indicator LED -->
  <circle cx="50" cy="14" r="2.5" fill="#3ddc84"/>
</svg>
