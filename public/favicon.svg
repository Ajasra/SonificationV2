<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- CRT Phosphor Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Chassis Void (Chassis Charcoal #0c0f0c / 1px Hairline Border #222921) -->
  <rect x="2" y="2" width="60" height="60" rx="4" fill="#0c0f0c" stroke="#222921" stroke-width="1.5"/>

  <!-- GD&T Corner Registration Ticks (┌ ┐ └ ┘ in #606a5b) -->
  <path d="M 7 15 V 7 H 15" fill="none" stroke="#606a5b" stroke-width="1.5" stroke-linecap="square"/>
  <path d="M 49 7 H 57 V 15" fill="none" stroke="#606a5b" stroke-width="1.5" stroke-linecap="square"/>
  <path d="M 7 49 V 57 H 15" fill="none" stroke="#606a5b" stroke-width="1.5" stroke-linecap="square"/>
  <path d="M 49 57 H 57 V 49" fill="none" stroke="#606a5b" stroke-width="1.5" stroke-linecap="square"/>

  <!-- Center Zero Graticule Hairline (#1d261d) -->
  <line x1="8" y1="32" x2="56" y2="32" stroke="#1d261d" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- Resonant DSP CRT Oscilloscope Trace (#c8d665) -->
  <path d="M 8 32 H 18 C 22 32, 24 13, 29 13 C 34 13, 33 51, 38 51 C 43 51, 45 32, 56 32" fill="none" stroke="#c8d665" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Telemetry Live Status Pip (#c8d665) -->
  <circle cx="49" cy="15" r="2.2" fill="#c8d665" filter="url(#glow)"/>
</svg>
