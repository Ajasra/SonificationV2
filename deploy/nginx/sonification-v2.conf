# Nginx virtual host for Sonification V2
# Domain: sonification.vasily.onl
# Reverse proxy to local PocketBase running on 127.0.0.1:38472 (loopback only)

server {
    listen 80;
    listen [::]:80;
    server_name sonification.vasily.onl;

    # Redirect all plain HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sonification.vasily.onl;

    # SSL certificates (obtained via Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/sonification.vasily.onl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sonification.vasily.onl/privkey.pem;

    # Recommended SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 10m;

    location / {
        # Internal proxy to PocketBase (strictly loopback on 127.0.0.1)
        proxy_pass http://127.0.0.1:38472;
        proxy_http_version 1.1;

        # WebSocket & Server-Sent Events (SSE) support for PocketBase real-time events
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable proxy buffering for real-time SSE streaming
        proxy_buffering off;
        proxy_read_timeout 360s;
    }
}

